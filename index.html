<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HMN Web</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main>
      <aside>
        <div class="brand"><span>H</span><div><b>HMN Web</b><small>Managed Network Console</small></div></div>
        <nav>
          <a class="active">总览</a>
          <a>节点</a>
          <a>任务</a>
          <a>审批</a>
          <a>网络</a>
        </nav>
      </aside>
      <section class="content">
        <header class="topbar">
          <div>
            <p>借鉴 Komari 的探针视图，但面向 HMN 托管、审批、任务和资产闭环。</p>
            <h1>节点状态总览</h1>
          </div>
          <button>接入新节点</button>
        </header>
        <div class="api-status" id="api-status">核心 API 连接中…</div>
        <div class="metrics" id="metrics"></div>
        <div class="layout">
          <section class="panel wide">
            <header><h2>节点探针</h2><span>CPU / 内存 / 磁盘 / 心跳</span></header>
            <div class="nodes" id="nodes"></div>
          </section>
          <section class="panel">
            <header><h2>网络流量</h2><span>聚合视图</span></header>
            <div class="bar-chart">
              <i style="height:40%"></i><i style="height:70%"></i><i style="height:52%"></i><i style="height:88%"></i><i style="height:60%"></i><i style="height:95%"></i>
            </div>
          </section>
          <section class="panel">
            <header><h2>最近任务</h2><span>审批/执行状态</span></header>
            <div class="tasks" id="tasks"></div>
          </section>
          <section class="panel">
            <header><h2>容量风险</h2><span>来自 worker facts</span></header>
            <div class="risk-list" id="risk-list"></div>
          </section>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
