<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HMN Web | Infrastructure Control</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#2563eb',
            accent: '#2563eb',
            background: '#f5f8fc',
            surface: '#ffffff',
            panel: '#ffffff',
            muted: '#667085',
            line: '#e5eaf2',
            success: '#10b981',
            warning: '#f59e0b',
            danger: '#ef4444'
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'monospace']
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="/src/styles.css?v=202605141015" />
</head>
<body class="bg-background text-slate-900 font-sans overflow-hidden">
  <div id="mobile-scrim" class="mobile-scrim" aria-hidden="true"></div>
  <div class="flex h-screen w-full">
    <aside id="sidebar" class="fixed left-0 top-0 bottom-0 z-50 flex w-64 flex-col border-r border-line bg-[#0f0d13] p-6">
      <div class="brand-lockup mb-10">
        <div class="brand-badge">HMN</div>
        <div class="brand-copy min-w-0">
          <h1 class="brand-title">Hermes Managed Network</h1>
          <p class="brand-subtitle">Infrastructure Control Plane</p>
        </div>
      </div>

      <nav id="side-nav" class="flex-1 space-y-1">
        <button data-page="overview" class="nav-item active"><span class="nav-icon"><span class="material-symbols-outlined">dashboard</span></span><span>总览</span></button>
        <button data-page="nodes" class="nav-item"><span class="nav-icon"><span class="material-symbols-outlined">developer_board</span></span><span>节点</span></button>
        <button data-page="tasks" class="nav-item"><span class="nav-icon"><span class="material-symbols-outlined">assignment</span></span><span>任务</span></button>
        <button data-page="approvals" class="nav-item"><span class="nav-icon"><span class="material-symbols-outlined">verified_user</span></span><span>审批</span><span id="approval-count" class="ml-auto rounded-full bg-red-500/15 px-2 py-0.5 text-[10px] text-red-200">0</span></button>
        <button data-page="services" class="nav-item"><span class="nav-icon"><span class="material-symbols-outlined">dns</span></span><span>服务资产</span></button>
        <button data-page="join" class="nav-item"><span class="nav-icon"><span class="material-symbols-outlined">group_add</span></span><span>接入节点</span></button>
        <button data-page="backup" class="nav-item"><span class="nav-icon"><span class="material-symbols-outlined">backup</span></span><span>备份恢复</span></button>
        <button data-page="network" class="nav-item"><span class="nav-icon"><span class="material-symbols-outlined">lan</span></span><span>网络 ACL</span></button>
        <button data-page="components" class="nav-item"><span class="nav-icon"><span class="material-symbols-outlined">widgets</span></span><span>组件</span></button>
        <button data-page="headscale" class="nav-item"><span class="nav-icon"><span class="material-symbols-outlined">vpn_lock</span></span><span>Headscale</span></button>
        <button data-page="docs" class="nav-item"><span class="nav-icon"><span class="material-symbols-outlined">description</span></span><span>文档中心</span></button>
        <button data-page="themes" class="nav-item"><span class="nav-icon"><span class="material-symbols-outlined">palette</span></span><span>主题</span></button>
        <button data-page="permissions" class="nav-item"><span class="nav-icon"><span class="material-symbols-outlined">admin_panel_settings</span></span><span>账户权限</span></button>
        <button data-page="skills" class="nav-item"><span class="nav-icon"><span class="material-symbols-outlined">psychology</span></span><span>Hermes 技能</span></button>
        <button data-page="conversations" class="nav-item"><span class="nav-icon"><span class="material-symbols-outlined">forum</span></span><span>Hermes 对话</span></button>
        <button data-page="platform" class="nav-item"><span class="nav-icon"><span class="material-symbols-outlined">tune</span></span><span>平台配置</span></button>
      </nav>

      <button id="new-request" class="mb-6 flex w-full items-center justify-center gap-2 rounded-2xl bg-primary px-4 py-3 text-sm font-semibold text-white transition hover:brightness-110">
        <span class="material-symbols-outlined text-[18px]">add</span>新任务
      </button>
      <div class="sidebar-status-card">
        <div class="sidebar-status-badge">HMN</div>
        <div class="min-w-0 flex-1">
          <p class="sidebar-status-label">Secure Access · HMN Web</p>
          <p class="truncate text-xs font-semibold uppercase tracking-wide text-white">ADMIN_CLUSTER_01</p>
          <p id="api-status" class="truncate text-[11px] text-muted">API 连接中…</p>
        </div>
      </div>
    </aside>

    <main class="ml-64 flex h-full flex-1 flex-col bg-background">
      <header class="sticky top-0 z-40 flex h-16 items-center justify-between border-b border-line bg-panel/80 px-8 backdrop-blur-md">
        <div class="flex min-w-0 items-center gap-4 md:gap-8">
          <button id="mobile-menu" class="icon-btn mobile-menu-btn" title="菜单"><span class="material-symbols-outlined">menu</span></button>
          <h2 id="page-title" class="text-xl font-bold text-white">总览</h2>
          <div id="top-search-shell" class="search-shell relative hidden w-80 md:block">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-[18px] text-muted">search</span>
            <input id="search-input" class="search-input w-full rounded-full border-line py-1.5 pl-10 pr-4 text-sm text-white placeholder:text-muted focus:border-primary focus:ring-primary" placeholder="搜索节点、任务、服务…" type="search" />
          </div>
        </div>
        <div class="flex items-center gap-3">
          <button id="refresh-btn" class="icon-btn" title="刷新"><span class="material-symbols-outlined">refresh</span></button>
          <button id="mode-toggle" class="icon-btn" title="浅色/深色"><span class="material-symbols-outlined">dark_mode</span></button>
          <select id="lang-select" class="lang-select" title="语言">
            <option value="zh-CN">中文</option>
            <option value="en">EN</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
          </select>
          <button id="top-join-button" data-switch="join" class="primary-action">接入节点</button>
        </div>
      </header>

      <section id="content" class="flex-1 overflow-y-auto p-8"></section>
    </main>
  </div>
  <div id="toast-container" class="fixed bottom-6 right-6 z-[80] grid gap-3"></div>
  <script src="/src/main.js?v=202605141125"></script>
</body>
</html>
